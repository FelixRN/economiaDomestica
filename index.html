<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <script src="script/script.js" defer></script>
    <title>Gestión Economía Doméstica</title>
</head>
<body>
    <h1>Gestión Economía Doméstica</h1>

    <div id="conceptos">
        <div class="concepto" data-indice="0">
            <img src="img/alquiler.jpg" alt="Alquiler">
            <p class="nombre">Alquiler</p>
            <p class="precio">650 €</p>
        </div>
        <div class="concepto" data-indice="1">
            <img src="img/electricidad.jpg" alt="Luz">
            <p class="nombre">Luz</p>
            <p class="precio">55 €</p>
        </div>
        <div class="concepto" data-indice="2">
            <img src="img/agua.jpg" alt="Agua">
            <p class="nombre">Agua</p>
            <p class="precio">15 €</p>
        </div>
        <div class="concepto" data-indice="3">
            <img src="img/gas.jpg" alt="Gas">
            <p class="nombre">Gas</p>
            <p class="precio">30 €</p>
        </div>
        <div class="concepto" data-indice="4">
            <img src="img/basura_comunidad.jpg" alt="Basura y comunidad">
            <p class="nombre">Basura y comunidad</p>
            <p class="precio">15 €</p>
        </div>
        <div class="concepto" data-indice="5">
            <img src="img/seguros_hogar.jpg" alt="Seguros del hogar">
            <p class="nombre">Seguros del hogar</p>
            <p class="precio">50 €</p>
        </div>
        <div class="concepto" data-indice="6">
            <img src="img/internet.jpg" alt="Internet">
            <p class="nombre">Internet</p>
            <p class="precio">25 €</p>
        </div>
        <div class="concepto" data-indice="7">
            <img src="img/cesta_compra.jpg" alt="Cesta de la compra">
            <p class="nombre">Cesta de la compra</p>
            <p class="precio">100 €</p>
        </div>
        <div class="concepto" data-indice="8">
            <img src="img/transporte.jpg" alt="Transporte">
            <p class="nombre">Transporte</p>
            <p class="precio">25 €</p>
        </div>
        <div class="concepto" data-indice="9">
            <img src="img/ocio.jpg" alt="Ocio">
            <p class="nombre">Ocio</p>
            <p class="precio">50 €</p>
        </div>
    </div>

    <div id="resumen">
        <h2>Resumen de gastos</h2>
    </div>

    <button id="finalizar">Finalizar trámite</button>
</body>
</html>
